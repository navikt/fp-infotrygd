kind: Application
apiVersion: nais.io/v1alpha1
metadata:
  name: {{appName}}
  namespace: teamforeldrepenger
  labels:
    team: teamforeldrepenger
spec:
  image: {{image}}
  port: 8080
  webproxy: true
  liveness:
    path: /actuator/health
    initialDelay: 15
    periodSeconds: 10
    failureThreshold: 20
    timeout: 3
  readiness:
    path: /actuator/health
    initialDelay: 15
    periodSeconds: 10
    failureThreshold: 20
    timeout: 3
  replicas:
    min: {{minReplicas}}
    max: {{maxReplicas}}
    scalingStrategy:
      cpu:
        thresholdPercentage: 80
  resources:
    limits:
      cpu: "{{limits.cpu}}"
      memory: "{{limits.mem}}"
    requests:
      cpu: "{{requests.cpu}}"
      memory: "{{requests.mem}}"
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java
      destinations:
        - id: "grafana-lgtm"
        - id: "elastic-apm"
    logging:
      destinations:
        - id: loki
        - id: elastic
  vault:
    enabled: true
    paths:
      - mountPath: /var/run/secrets/nais.io/defaultDSconfig
        kvPath: {{oracleConfig}}
      - mountPath: /var/run/secrets/nais.io/defaultDS
        kvPath:  {{oracleSecret}}
  {{#if env}}
  env:
  {{#each env}}
      - name: {{@key}}
        value: "{{this}}"
  {{/each}}
  {{/if}}
  azure:
    application:
      enabled: true
      claims:
        extra:
          - "azp_name"
  {{#if AZURE_IAC_RULES}}
  accessPolicy:
    inbound:
      rules:
      {{#each AZURE_IAC_RULES}}
       - application: {{app}}
         namespace: {{namespace}}
         cluster: {{cluster}}
      {{/each}}
  {{/if}}
