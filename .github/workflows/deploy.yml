name: "Deploy"
# Repo-lokal, gjenbrukbar deploy-workflow for fp-infotrygd.
#
# Hvorfor finnes denne, i stedet for den delte navikt/fp-gha-workflows/.../deploy.yml?
# fp-infotrygd deployer TRE apper fra ett repo (foreldrepenger, svangerskapspenger,
# sykepenger). Hver app har sitt eget GitHub Environment på formen
# `${app}:${cluster}:${namespace}` (f.eks. `foreldrepenger:prod-fss:teamforeldrepenger`),
# og prod-miljøene har egne beskyttelsesregler (påkrevde reviewers). Den delte deploy.yml
# hardkoder `environment: ${cluster}:${namespace}` uten app-ledd, og kan derfor ikke
# uttrykke per-app-miljøene – å bruke den direkte ville kjøre prod-deploy mot et
# ubeskyttet miljø og omgå påkrevd godkjenning.
#
# Konfig-stien (`.deploy/${app}/...`) kan derimot allerede løses med den delte via
# `deploy_context`. Det eneste reelle hinderet er environment-navnet.
#
# TODO: Bør ses nærmere på. Hvis den delte deploy.yml får et valgfritt app-/environment-ledd
# i `environment:`-navnet, kan denne lokale kopien fjernes og erstattes med et kall til
# navikt/fp-gha-workflows/.github/workflows/deploy.yml (gar: true, deploy_context: /<app>).

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
        description: 'Image tag to deploy (example 2023.03.10.080433-f821119)'
      cluster:
        required: true
        type: string
        description: 'The cluster to deploy to (dev-fss|dev-gcp|prod-fss|prod-gcp)'
      namespace:
        required: false
        type: string
        description: 'The namespace to deploy to'
        default: 'teamforeldrepenger'
      app:
        required: true
        type: string
        description: 'The app to deploy (foreldrepenger|svangerskapspenger|sykepenger)'

jobs:
  deploy:
    name: deploy
    environment: ${{ inputs.app }}:${{ inputs.cluster }}:${{ inputs.namespace }}
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Login GAR
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # ratchet:nais/login@v0
        id: login
        with:
          team: teamforeldrepenger

      - name: Deploy av fp-infotrygd-${{ inputs.app }} til ${{ inputs.cluster }} fra GAR
        uses: nais/deploy/actions/deploy@027a91857992525139798892f2804b0ca21f4af6 # ratchet:nais/deploy/actions/deploy@v2
        env:
          PRINT_PAYLOAD: true
          CLUSTER: ${{ inputs.cluster }}
          IMAGE: ${{ steps.login.outputs.registry }}/${{ github.repository }}:${{ inputs.image }}
          RESOURCE: .deploy/naiserator.yaml
          VARS: .deploy/${{ inputs.app }}/${{ inputs.cluster }}-${{ inputs.namespace }}.json
