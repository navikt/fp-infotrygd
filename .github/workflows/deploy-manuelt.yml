name: Deploy manuelt
on:
  workflow_dispatch:
    inputs:
      image:
        required: true
        type: string
        description: 'Image tag to deploy (example 2023.03.10.080433-f821119)'
      environment:
        required: true
        type: choice
        description: 'The environment to deployed to (dev|prod)'
        options:
          - dev
          - prod
      app:
        required: true
        type: choice
        description: 'The namespace to deployed to (foreldrepenger|svangerskapspenger|sykepenger)'
        options:
          - foreldrepenger
          - svangerskapspenger
          - sykepenger

jobs:
  deploy:
    name: Deploy dev
    permissions:
      contents: read
      id-token: write
    uses: navikt/fp-infotrygd/.github/workflows/deploy.yml@master
    with:
      image: ${{ inputs.image }}
      cluster: ${{ inputs.environment }}-fss
      app: ${{ inputs.app }}
    secrets: inherit