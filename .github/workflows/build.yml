name: "Bygg og deploy"
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'
      - '.editorconfig'
      - '.java-version'
      - '.gitattributes'
      - 'LICENSE'
      - 'CODEOWNERS'
      - 'docs/**'
      - '.oracle/**'
      - '.github/*.yml'

jobs:
  build-app:
    name: Build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: navikt/fp-gha-workflows/.github/workflows/build-app-no-db.yml@main
    with:
      sonar-scan: false
      build-image: ${{ github.ref_name == 'master' }}
      push-image: ${{ github.ref_name == 'master' }}
    secrets: inherit

  deploy-fp:
    strategy:
      matrix:
        envs: [ 'dev', 'prod' ]
    name: Deploy FP to ${{ matrix.envs }}
    permissions:
      id-token: write
    if: github.ref_name == 'master'
    needs: [build-app]
    uses: navikt/fp-infotrygd/.github/workflows/deploy.yml@master
    with:
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: ${{ matrix.envs }}-fss
      app: foreldrepenger
    secrets: inherit

  deploy-svp:
    strategy:
      matrix:
        envs: [ 'dev', 'prod' ]
    name: Deploy SVP to ${{ matrix.envs }}
    permissions:
      id-token: write
    if: github.ref_name == 'master'
    needs: [build-app]
    uses: navikt/fp-infotrygd/.github/workflows/deploy.yml@master
    with:
      image: ${{ needs.build-app.outputs.build-version }}
      cluster: ${{ matrix.envs }}-fss
      app: svangerskapspenger
    secrets: inherit


