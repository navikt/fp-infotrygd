spring:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: INFOTRYGD_Q0
    open-in-view: false
  datasource:
    url: jdbc:h2:mem:testdb:MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      platform: h2
      continue-on-error: true
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - aud-localhost
