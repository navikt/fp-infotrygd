spring:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: INFOTRYGD_Q0
  datasource:
    url: jdbc:h2:mem:testdb:MODE=Oracle
    username: sa
    password:
    driver-class-name: org.h2.Driver
    initialization-mode: always
    platform: h2
