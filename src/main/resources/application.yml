server.port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:testdb:MODE=Oracle
    username: sa
    password: sa
    platform: h2
    tomcat:
      driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.Oracle10gDialect
    hibernate:
      ddl-auto: "none"
    properties:
      hibernate:
        default_schema: INFOTRYGD_Q0

